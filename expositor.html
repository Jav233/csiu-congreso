<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel del expositor · XI CSIU</title>
  <meta name="description" content="Panel para expositores del XI Congreso CSIU: tus actividades, semáforo de tiempo y certificado de ponente.">
  <meta name="theme-color" content="#0b3a29">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261106-0731">
  <link rel="stylesheet" href="css/ruta.css?v=20261106-0731">
  <link rel="stylesheet" href="css/paneles.css?v=20261106-0731">
</head>
<body data-pagina="expositor">
  <main id="main" class="wrap">
    <div class="page-head panel-head">
      <div>
        <h1>Panel del expositor</h1>
        <p>Tus actividades, el semáforo de tiempo y tu certificado</p>
      </div>
      <button class="btn btn--ghost btn--sm" id="btnSalir" type="button" hidden><i data-lucide="log-out"></i>Cerrar sesión</button>
    </div>

    <section class="acceso card" id="acceso" hidden>
      <h2>Ingresa a tu panel</h2>
      <form class="form" id="formAcceso" novalidate>
        <!-- Paso 1: encontrarse (opcional) -->
        <div id="pasoBuscar">
          <label for="buscaExp">Busca tu nombre o tu exposición <small>también sirve tu institución</small></label>
          <div class="campo campo--ac">
            <i data-lucide="search"></i>
            <input id="buscaExp" type="text" placeholder="Ej.: Heredia, Power BI, ingeniería social…" enterkeyhint="search">
          </div>
        </div>
        <!-- Persona elegida -->
        <div class="elegido" id="elegido" hidden>
          <span class="avatar" id="elegidoAv" aria-hidden="true"></span>
          <span class="elegido__txt"><strong id="elegidoNom"></strong><small id="elegidoInst"></small></span>
          <button class="btn btn--ghost btn--sm" type="button" id="btnCambiar">Cambiar</button>
        </div>
        <!-- Paso 2: el código es la llave -->
        <label for="codigoExp" id="lblCodigo">Código de acceso <small>lo envía el comité organizador</small></label>
        <input id="codigoExp" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="EXP-0000" required aria-describedby="errAcceso">
        <p class="error" id="errAcceso" role="alert" hidden></p>
        <button class="btn btn--primary" type="submit"><i data-lucide="log-in"></i>Entrar</button>
        <button class="btn btn--secondary" type="button" id="btnPruebaExp">Completar con datos de prueba</button>
      </form>
      <p class="aviso-demo"><i data-lucide="info"></i><span>¿Ya tienes tu código? Escríbelo directamente. Prototipo: los códigos de todos los expositores se ven en el panel del organizador (código <strong>ORG-2026</strong>).</span></p>
    </section>

    <div id="panel" hidden></div>
  </main>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/datos.js?v=20261106-0731"></script>
  <script src="js/comun.js?v=20261106-0731"></script>
  <script src="js/ruta.js?v=20261106-0731"></script>
  <script src="js/certificado.js?v=20261106-0731"></script>
  <script src="js/portadas.js?v=20261106-0731"></script>
  <script src="js/autocompletar.js?v=20261106-0731"></script>
  <script src="js/expositor.js?v=20261106-0731"></script>
</body>
</html>
