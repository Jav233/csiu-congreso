<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="n-sphere" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#b9ffe3" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#0b4f3a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#042419" stop-opacity="0.92"/>
    </radialGradient>
    <linearGradient id="n-ring-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ff3c0"/>
      <stop offset="55%" stop-color="#1fc283"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="n-ring-cyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6ff3c0"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Back orbital arcs -->
  <ellipse cx="60" cy="60" rx="52" ry="20" transform="rotate(-28 60 60)" stroke="url(#n-ring-cyan)" stroke-width="3" stroke-opacity="0.45"/>
  <ellipse cx="60" cy="60" rx="52" ry="20" transform="rotate(28 60 60)" stroke="url(#n-ring-mint)" stroke-width="3" stroke-opacity="0.45"/>

  <!-- Translucent 3D crystal sphere -->
  <circle cx="60" cy="60" r="37" fill="url(#n-sphere)" stroke="#7cefd1" stroke-width="1.6" stroke-opacity="0.7"/>
  <ellipse cx="48" cy="38" rx="16" ry="8" transform="rotate(-18 48 38)" fill="#ffffff" fill-opacity="0.22"/>

  <!-- Internal neural constellation (forming a subtle N in the center) -->
  <g stroke="#7cefd1" stroke-opacity="0.55" stroke-width="1.1">
    <line x1="38" y1="74" x2="38" y2="44"/>
    <line x1="38" y1="44" x2="60" y2="60"/>
    <line x1="60" y1="60" x2="82" y2="74"/>
    <line x1="82" y1="74" x2="82" y2="44"/>
    <line x1="38" y1="44" x2="54" y2="35"/>
    <line x1="54" y1="35" x2="72" y2="40"/>
    <line x1="72" y1="40" x2="82" y2="44"/>
    <line x1="38" y1="74" x2="50" y2="83"/>
    <line x1="50" y1="83" x2="68" y2="82"/>
    <line x1="68" y1="82" x2="82" y2="74"/>
    <line x1="54" y1="35" x2="60" y2="60"/>
    <line x1="72" y1="40" x2="60" y2="60"/>
    <line x1="50" y1="83" x2="60" y2="60"/>
    <line x1="68" y1="82" x2="60" y2="60"/>
    <line x1="38" y1="59" x2="60" y2="60"/>
    <line x1="82" y1="59" x2="60" y2="60"/>
  </g>

  <!-- Glowing neural nodes -->
  <g fill="#ecfff7">
    <circle cx="38" cy="44" r="2.8" fill="#6ff3c0"/>
    <circle cx="38" cy="74" r="2.8" fill="#6ff3c0"/>
    <circle cx="60" cy="60" r="3.6" fill="#38bdf8"/>
    <circle cx="82" cy="44" r="2.8" fill="#38bdf8"/>
    <circle cx="82" cy="74" r="2.8" fill="#38bdf8"/>
    <circle cx="54" cy="35" r="2.1"/>
    <circle cx="72" cy="40" r="2.1"/>
    <circle cx="50" cy="83" r="2.1"/>
    <circle cx="68" cy="82" r="2.1"/>
    <circle cx="38" cy="59" r="2"/>
    <circle cx="82" cy="59" r="2"/>
  </g>

  <!-- Front orbital arcs -->
  <path d="M 14 35 A 52 20 0 0 0 106 85" stroke="url(#n-ring-mint)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 14 85 A 52 20 0 0 0 106 35" stroke="url(#n-ring-cyan)" stroke-width="3.4" stroke-linecap="round"/>
</svg>
